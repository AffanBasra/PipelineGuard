[build-system]
# 77+ for the PEP 639 `license` string form used below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineguard"
version = "0.2.0"
description = "Streaming PII/data-quality firewall for Kafka, with a Pakistani-locale focus"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "faker>=26.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# Tier 2. An extra rather than a hard dependency because torch and its
# transitive weights pull ~1 GB into the image, and the processor runs
# rules-only without them -- which is the default (TIER2_ENABLED=false).
# Until this existed the Docker image could not run Tier 2 at all: these two
# lived only in requirements.txt, which the Dockerfile never reads.
#
# `pip install '.[tier2]'` on Linux pulls the CUDA build of torch. For a CPU
# image, install torch from the CPU index FIRST; see the Dockerfile.
tier2 = ["torch>=2.13", "gliner>=0.2.28"]

# The local inspection UI. Separate from `tier2` on purpose: installing both
# together lets pip re-resolve `torch>=2.13` and replace a working CUDA build
# with the CPU wheel from PyPI. Install into an env that already has tier2.
#
# Deliberately absent from requirements.txt, which the Dockerfile reads -- the
# processor image has no business carrying a web server.
ui = ["streamlit>=1.40", "fpdf2>=2.8", "markdown-it-py>=3.0",
      "streamlit-option-menu>=0.4", "pillow>=10.0"]

# src layout: the package lives in src/, so it is importable only once installed.
# `pip install -e .` puts it on the path for the terminal, for pytest and for any
# IDE — without it, `python -m pipelineguard.processor` works only if the IDE has
# been told to treat src/ as a source root.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a running Kafka/Postgres stack (deselect with '-m \"not integration\"')",
]
