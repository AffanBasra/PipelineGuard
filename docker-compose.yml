# Two config surfaces exist and are easy to confuse:
#
#   from the host       kafka -> localhost:9092    postgres -> localhost:5433
#   between containers  kafka -> kafka:19092       postgres -> postgres:5432
#
# The application defaults in config.py are the host values, because that is
# where the test suite and ad-hoc runs live. Every containerised service below
# therefore overrides them. .env is excluded from the image (see .dockerignore)
# so it cannot silently reinstate the host values inside a container.

x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:19092
  POSTGRES_DSN: postgresql://pipelineguard:pipelineguard@postgres:5432/pipelineguard
  # Off by default, matching config.py. Turning it on needs an image built with
  # INSTALL_TIER2=true; the processor now says so instead of failing on an
  # import three frames deep.
  TIER2_ENABLED: ${TIER2_ENABLED:-false}
  # Pinned to the commit every number in tier2-detection-findings.md was
  # measured against. A HuggingFace model repo is a git repo: this one changed
  # on 2026-04-28 without its name changing, and the 0.55 threshold is only
  # valid for one set of weights (§6.1).
  TIER2_MODEL_REVISION: ${TIER2_MODEL_REVISION:-88c3b98b57ad5e7d66fb209ed61c53f4b1fd05da}
  # The revision above pins the GLiNER weights but not GLiNER's base tokenizer,
  # which it resolves from microsoft/deberta-v3-base at `main`. Once the models
  # volume is warm, set HF_HUB_OFFLINE=1 to freeze everything and drop the
  # boot-time dependency on HuggingFace entirely. Leave it unset for the first
  # run, which has to download.
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-}

x-app-image: &app-image
  build:
    context: .
    args:
      # Tier 2 is opt-in at build time: torch and gliner add ~1 GB. Set
      # INSTALL_TIER2=true in .env to build an image that can run it.
      INSTALL_TIER2: ${INSTALL_TIER2:-false}
  image: pipelineguard:local

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: container-to-container. EXTERNAL: host apps (our Python processes on Windows).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by scripts/create_topics.py — no surprises.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Without this the log lives under /tmp and does not survive `down`,
      # which is incoherent for a system whose durability argument rests on
      # that log. See the kafkadata volume note at the bottom of this file.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: pg-postgres
    ports:
      - "5433:5432"   # host 5432 is taken by a pre-existing native Postgres install
    environment:
      POSTGRES_USER: pipelineguard
      POSTGRES_PASSWORD: pipelineguard
      POSTGRES_DB: pipelineguard
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelineguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. Broker auto-create is disabled, so the processor
  # would subscribe to nothing without this. `service_completed_successfully`
  # on the processor is what turns "topics probably exist by now" into an
  # ordering guarantee.
  topics-init:
    <<: *app-image
    container_name: pg-topics-init
    command: ["python", "scripts/create_topics.py"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  processor:
    <<: *app-image
    # Deliberately no container_name: compose refuses to scale a service that
    # has one, and `docker compose up --scale processor=3` is the whole
    # consumer-group demonstration.
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
    # This is what makes the crash-and-replay design real rather than
    # asserted. An infrastructure failure kills the process by design; the
    # restart replays from the last committed offset, and the idempotent
    # audit upsert makes the repeat harmless.
    restart: unless-stopped
    # Model weights survive the container. Without this, every restart re-fetches
    # ~1.7 GB from HuggingFace -- and the restart policy above would turn one
    # network outage into a download loop.
    volumes:
      - models:/models

  # One-shot, and the reason `docker compose up` is a complete demonstration
  # rather than an empty pipeline: it feeds a bounded batch and exits. Running
  # `up` again seeds again, which is additive rather than harmful -- the audit
  # trail is keyed on message id and every record is synthetic.
  #
  # Set SEED_COUNT=0 to skip it once the volume already holds data.
  seed:
    <<: *app-image
    entrypoint: ["python", "-m", "pipelineguard.producer"]
    command: ["--rate", "${SEED_RATE:-200}", "--count", "${SEED_COUNT:-1000}"]
    environment: *app-env
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
      # After the processor, so the records it writes are consumed rather than
      # sitting unread until someone notices the topic has a backlog.
      processor:
        condition: service_started

  # ---------------------------------------------------------------------- #
  # On-demand tools. The `tools` profile keeps them out of `docker compose
  # up`, while `docker compose run` activates a service's profile
  # automatically -- so they are available without ever starting by accident.
  #
  # `entrypoint` rather than `command` so arguments append cleanly:
  #     docker compose run --rm producer --rate 50 --count 1000
  # ---------------------------------------------------------------------- #
  producer:
    <<: *app-image
    profiles: ["tools"]
    entrypoint: ["python", "-m", "pipelineguard.producer"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  report:
    <<: *app-image
    profiles: ["tools"]
    entrypoint: ["python", "-m", "pipelineguard.report"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  # The Kafka log. Previously absent, which meant `docker compose down`
  # discarded every message and every committed offset -- convenient while
  # benchmarking, incoherent for a pipeline whose at-least-once argument
  # rests on the log surviving a restart.
  kafkadata:
  # The Tier 2 model cache (HF_HOME). Keeps the pinned checkpoint on disk
  # across restarts, so the processor does not depend on HuggingFace being
  # reachable at boot.
  models:
