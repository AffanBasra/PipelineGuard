[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineguard"
version = "0.2.0"
description = "Streaming PII/data-quality firewall for Kafka, with a Pakistani-locale focus"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "faker>=26.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

# src layout: the package lives in src/, so it is importable only once installed.
# `pip install -e .` puts it on the path for the terminal, for pytest and for any
# IDE — without it, `python -m pipelineguard.processor` works only if the IDE has
# been told to treat src/ as a source root.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a running Kafka/Postgres stack (deselect with '-m \"not integration\"')",
]
